[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vrgrid"
version = "0.0.0"
description = "Adaptive variable-resolution 2.5D LiDAR mapping (SIH26053)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
dash = ["rerun-sdk>=0.16"]
dev = ["pytest>=7.4", "ruff>=0.4"]

# The repo is laid out by OWNER (src/grid = Aakash, src/gpu = Shrestha, ...) so
# that two people rarely touch the same file. These mappings make that layout
# importable as one `vrgrid` package, so the documented commands work:
#   python -m vrgrid.run    python -m vrgrid.dash
[tool.setuptools]
packages = [
    "vrgrid",
    "vrgrid.grid",
    "vrgrid.eval",
    "vrgrid.gpu",
    "vrgrid.perception",
    "vrgrid.run",
    "vrgrid.dash",
    "vrgrid.adapters",
]

[tool.setuptools.package-dir]
"vrgrid" = "include/vrgrid"          # FROZEN shared surface
"vrgrid.grid" = "src/grid"
"vrgrid.eval" = "src/eval"
"vrgrid.gpu" = "src/gpu"
"vrgrid.perception" = "src/perception"
"vrgrid.run" = "src/run"
"vrgrid.dash" = "dashboard"
"vrgrid.adapters" = "adapters"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "determinism: same input twice -> identical map hash (CI-blocking)",
    "partition: exactly one cell per ring per point (CI-blocking)",
    "theorem: proves a result from docs/sih-math.md -- never weaken to pass",
]

[tool.ruff]
line-length = 100
